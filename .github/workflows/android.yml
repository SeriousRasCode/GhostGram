name: Android CI (APK Build)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create debug signing key
      run: |
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass android \
          -keypass android \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Write Telegram credentials
      if: github.event_name == 'push'
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      run: |
        if [[ -z "$TELEGRAM_API_ID" || -z "$TELEGRAM_API_HASH" ]]; then
          echo "Set TELEGRAM_API_ID and TELEGRAM_API_HASH as repository Actions secrets."
          exit 1
        fi
        printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
          "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > .env

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: ghostgram-debug-apks
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Publish APKs to GitHub Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for abi in arm64-v8a armeabi-v7a x86 x86_64; do
          cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "GhostGram-${abi}-debug.apk"
        done
        cp app/build/outputs/apk/debug/app-universal-debug.apk GhostGram-debug.apk
        gh release create "build-${GITHUB_RUN_NUMBER}" GhostGram-*-debug.apk GhostGram-debug.apk \
          --target "${GITHUB_SHA}" \
          --title "GhostGram debug build ${GITHUB_RUN_NUMBER}" \
          --notes "Automated debug build from commit ${GITHUB_SHA}." \
          --latest
